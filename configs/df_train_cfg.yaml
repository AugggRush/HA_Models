network_config:
  sr: 24000
  fft_size: 128
  hop_size: 48
  nb_erb: 32
  nb_df: 28
  norm_tau: 1
  lsnr_max: 35
  lsnr_min: -15
  min_nb_freqs: 2
  df_order: 5
  df_lookahead: 0
  pad_mode: 'input'
  conv_lookahead: 0
  conv_ch: 16
  conv_depthwise: True
  convt_depthwise: True
  conv_kernel: [1,3]
  convt_kernel: [1,3]
  conv_kernel_inp: [3,3]
  emb_hidden_dim: 16
  emb_num_layers: 2
  emb_gru_skip_enc: 'none'
  emb_gru_skip: 'none'
  df_gru_skip: 'none'
  df_hidden_dim: 16
  df_pathway_kernel_size_t: 1
  enc_concat: False
  df_num_layers: 3
  df_n_iter: 1
  lin_groups: 1
  enc_lin_groups: 16
  mask_pf: False
  pf_beta: 0.02
  lsnr_dropout: False


DDP:
  world_size: 2

optimizer:
  lr: 0.001

scheduler:
  kwargs:
    warmup_steps: 25000
    decay_until_step: 250000
    max_lr: 1e-3
    min_lr: 1e-7

  update_interval: step  # [step, epoch]

loss:
  fft_sizes: [512, 256, 128]
  hop_sizes: [192, 96, 48]
  win_lengths: [512, 256, 128]
  compress_factor: 0.3
  eps: 1e-12
  lamda_ri: 30
  lamda_mag: 70
  lambda_Mr: 1.0
  lambda_Hyb: 1.0

train_dataset: 
  clean_file_path: 'prepare_datasets/train_clean_24k.csv'
  noise_file_path: 'prepare_datasets/train_noise_24k_new.csv'
  rir_file_path: 'prepare_datasets/train_rir_24k.csv'
  fs: 24000
  length_in_seconds: 8
  num_data_per_epoch: 100000
  train: True
  snr_db: [0, 25]
  dr_db: [-35, -15]
  pure_noise_prob: 0.1
  random_seed: 0511
  max_readers: 256

train_dataloader: 
  batch_size: 32
  num_workers: 4
  drop_last: True
  pin_memory: True     # 启用锁页内存
  prefetch_factor: 2     # 每个worker预取2个batch
  persistent_workers: True # 保持worker进程  

validation_dataset: 
  clean_file_path: 'prepare_datasets/val_clean_24k.csv'
  noise_file_path: 'prepare_datasets/val_noise_24k_new.csv'
  rir_file_path: 'prepare_datasets/val_rir_24k.csv'
  fs: 24000
  length_in_seconds: 8
  num_data_per_epoch: 20000
  train: False
  snr_db: [0, 25]
  dr_db: [-35, -15]
  pure_noise_prob: 0.1
  random_seed: 2021
  max_readers: 256

validation_dataloader:
  batch_size: 32
  num_workers: 4
  pin_memory: True     # 启用锁页内存
  prefetch_factor: 2     # 每个worker预取2个batch
  persistent_workers: True # 保持worker进程  

samplerate: 24000

trainer:
  epochs: 500
  save_checkpoint_interval: 1
  clip_grad_norm_value: 3.0
  exp_path: /data/goodman/torch_nn_train/SEtrain/Ha_denoise/dfnet_92MMacs_8ch_hybLoss_mrLoss
  resume: False
  resume_datetime: 2024-12-31-14h28m

lmdb_datasets:
  train_lmdb_path: prepare_datasets/training_audio_24k_noDereverb.lmdb
  valid_lmdb_path: prepare_datasets/validation_audio_24k_noDereverb.lmdb

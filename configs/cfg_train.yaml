network_config:
  n_fft: 256
  hop_len: 48
  win_len: 192

DDP:
  world_size: 2

optimizer:
  lr: 0.001

scheduler:
  kwargs:
    warmup_steps: 25000
    decay_until_step: 250000
    max_lr: 1e-3
    min_lr: 1e-6

  update_interval: step  # [step, epoch]

FFT:
  n_fft: 512
  hop_length: 256
  win_length: 512

loss:
  n_fft: ${FFT.n_fft}
  hop_len: ${FFT.hop_length}
  win_len: ${FFT.win_length}
  compress_factor: 0.3
  eps: 1e-12
  lamda_ri: 30
  lamda_mag: 70

train_dataset: 
  clean_file_path: 'prepare_datasets/train_clean_24k.csv'
  noise_file_path: 'prepare_datasets/train_noise_24k.csv'
  rir_file_path: 'prepare_datasets/train_rir_24k.csv'
  fs: 24000
  length_in_seconds: 8
  num_data_per_epoch: 300000
  train: True
  snr_db: [5, 20]
  dr_db: [-50, -20]
  pure_noise_prob: 0.0
  random_seed: 0929
  max_readers: 256

train_dataloader: 
  batch_size: 16
  num_workers: 4
  drop_last: True
  pin_memory: True     # 启用锁页内存
  prefetch_factor: 2     # 每个worker预取2个batch
  persistent_workers: True # 保持worker进程  

validation_dataset: 
  clean_file_path: 'prepare_datasets/val_clean_24k.csv'
  noise_file_path: 'prepare_datasets/val_noise_24k.csv'
  rir_file_path: 'prepare_datasets/val_rir_24k.csv'
  fs: 24000
  length_in_seconds: 8
  num_data_per_epoch: 30000
  train: True
  snr_db: [5, 20]
  dr_db: [-50, -20]
  pure_noise_prob: 0.0
  random_seed: 2025
  max_readers: 256

validation_dataloader:
  batch_size: 16
  num_workers: 4
  pin_memory: True     # 启用锁页内存
  prefetch_factor: 2     # 每个worker预取2个batch
  persistent_workers: True # 保持worker进程  

samplerate: 24000

trainer:
  epochs: 1000
  save_checkpoint_interval: 1
  clip_grad_norm_value: 3.0
  exp_path: /data/goodman/torch_nn_train/SEtrain/Ha_denoise/exp_gtcrn
  resume: False
  resume_datetime: 2024-12-31-14h28m

lmdb_datasets:
  train_lmdb_path: 'prepare_datasets/training_audio_24k.lmdb'
  valid_lmdb_path: 'prepare_datasets/validation_audio_24k.lmdb'